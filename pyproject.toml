[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crater2impactor"
version = "2.1.0"
description = "Crater2Impactor: Impactor Parameter Estimation from Lunar Impact Craters"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8", "httpx>=0.27", "pandas>=2.0", "fastapi>=0.110"]
data = ["matplotlib>=3.8", "openpyxl>=3.1"]
# OT-FMPE research code (research/otfmpe): training, sampling and the Kaggle runner
research = ["torch>=2.4", "kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["INTERNAL_ONLY/tests"]
